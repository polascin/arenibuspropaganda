name: Check hosting runtime and patch Composer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hosting-security.yml
      - scripts/hosting-security.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websupport-security-maintenance
  cancel-in-progress: false

jobs:
  composer-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Configure existing hosting SSH connection
        env:
          SSH_KEY: ${{ secrets.WEBSUPPORT_SSH_KEY }}
          SSH_HOST: ${{ secrets.WEBSUPPORT_SSH_HOST || 'shell.r1.websupport.sk' }}
          SSH_PORT: ${{ secrets.WEBSUPPORT_SSH_PORT || '26650' }}
        run: |
          test -n "$SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hosting_security_key
          chmod 600 ~/.ssh/hosting_security_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/hosting_security_known_hosts
      - name: Inventory runtime and update writable Composer PHAR
        env:
          SSH_HOST: ${{ secrets.WEBSUPPORT_SSH_HOST || 'shell.r1.websupport.sk' }}
          SSH_PORT: ${{ secrets.WEBSUPPORT_SSH_PORT || '26650' }}
          SSH_USER: ${{ secrets.WEBSUPPORT_SSH_USER || 'uid58858' }}
        run: |
          ssh -T -i ~/.ssh/hosting_security_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/hosting_security_known_hosts \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/hosting-security.sh
      - name: Remove temporary SSH identity
        if: always()
        run: rm -f ~/.ssh/hosting_security_key ~/.ssh/hosting_security_known_hosts
