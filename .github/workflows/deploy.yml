name: Build and deploy to arenibus.polascin.net

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify sync with origin/main
        run: |
          git fetch origin main
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "Local HEAD ($LOCAL_SHA) is out of sync with origin/main ($REMOTE_SHA)."
            exit 1
          fi
          echo "Repository is in sync with origin/main ($LOCAL_SHA)."

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check colour contrast (WCAG 2.1 AA)
        run: npm run check:contrast

      - name: Build static site
        run: npm run build

      - name: Check web links
        run: npm run check:links

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.WEBSUPPORT_SSH_KEY }}" ]; then
            echo "Error: GitHub secret WEBSUPPORT_SSH_KEY is not set."
            echo "Add the private SSH key for uid58858@shell.r1.websupport.sk under"
            echo "Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.WEBSUPPORT_DEPLOY_DIR }}" ]; then
            echo "Error: GitHub secret WEBSUPPORT_DEPLOY_DIR is not set."
            echo "Add the absolute remote path for the arenibus static site under"
            echo "Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.WEBSUPPORT_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.WEBSUPPORT_SSH_PORT || '26650' }}" "${{ secrets.WEBSUPPORT_SSH_HOST || 'shell.r1.websupport.sk' }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          bash scripts/websupport-push.sh \
            "${{ secrets.WEBSUPPORT_SSH_USER || 'uid58858' }}@${{ secrets.WEBSUPPORT_SSH_HOST || 'shell.r1.websupport.sk' }}" \
            "${{ secrets.WEBSUPPORT_SSH_PORT || '26650' }}" \
            "${{ secrets.WEBSUPPORT_DEPLOY_DIR }}"

      - name: Smoke test live site
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          sleep 5
          fail=0
          for path in / /privacy/ /terms/ /security/ /robots.txt /sitemap.xml; do
            sleep 2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "https://arenibus.polascin.net${path}")
            echo "https://arenibus.polascin.net${path} HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "https://arenibus.polascin.net${path}")
              echo "retry ${path} HTTP $STATUS"
            fi
            if [ "$STATUS" != "200" ]; then
              echo "Smoke test failed: ${path} did not return HTTP 200"
              fail=1
            fi
          done
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          CSP=$(curl -sI -A "$UA" "https://arenibus.polascin.net/" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-security-policy"{print $2}')
          echo "CSP: $CSP"
          case "$CSP" in
            *"script-src"*"'unsafe-inline'"*)
              echo "CSP allows Next.js inline hydration scripts"
              ;;
            *)
              echo "Smoke test failed: CSP must include script-src 'unsafe-inline' for Next.js hydration"
              exit 1
              ;;
          esac
          echo "Live routes responded with HTTP 200"
